  <!-- P left bowl mid bar -->
  <rect x="4" y="17.25" width="13" height="3.5" fill="currentColor"/>
  <!-- P left bowl right stem -->
  <rect x="13.5" y="6" width="3.5" height="14.75" fill="currentColor"/>

  <!-- P right stem -->
