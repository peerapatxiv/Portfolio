<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Background -->
  <rect width="40" height="40" rx="8" fill="#111110"/>

  <!-- Letters span x 7–33 and y 9–31, centered in the 40×40 square -->

  <!-- Left P: stem -->
  <rect x="7" y="9" width="3" height="22" fill="#F2F2EF"/>
  <!-- Left P: top bar -->
  <rect x="7" y="9" width="10" height="2.8" fill="#F2F2EF"/>
  <!-- Left P: mid bar -->
  <rect x="7" y="17.6" width="10" height="2.8" fill="#F2F2EF"/>
  <!-- Left P: right stem (bowl) -->
  <rect x="14" y="9" width="3" height="11.4" fill="#F2F2EF"/>

  <!-- Right P: stem -->
  <rect x="23" y="9" width="3" height="22" fill="#F2F2EF"/>
  <!-- Right P: top bar -->
  <rect x="23" y="9" width="10" height="2.8" fill="#F2F2EF"/>
  <!-- Right P: mid bar -->
  <rect x="23" y="17.6" width="10" height="2.8" fill="#F2F2EF"/>
  <!-- Right P: right stem (bowl) -->
  <rect x="30" y="9" width="3" height="11.4" fill="#F2F2EF"/>
</svg>
